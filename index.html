<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Трекер доходов и расходов</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      var saved = localStorage.getItem("salary-tracker-theme");
      var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body data-auth="loading">
  <div class="page">
    <header class="topbar">
      <div>
        <p class="eyebrow">Личные финансы</p>
        <h1>Трекер доходов и расходов</h1>
      </div>
      <div class="topbar-controls">
        <div class="account requires-user">
          <span class="account-email" id="account-email"></span>
          <button type="button" id="logout-btn" class="theme-toggle">Выйти</button>
        </div>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">Тёмная тема</button>
        <label class="month-field requires-user">
          <span>Месяц</span>
          <input type="month" id="month" name="month">
        </label>
      </div>
    </header>

    <p class="status-line requires-loading">Загрузка…</p>

    <section class="auth-screen requires-guest" aria-labelledby="auth-title">
      <article class="panel auth-card">
        <div class="auth-switch" role="tablist" aria-label="Вход или регистрация">
          <button type="button" class="tab" id="auth-mode-login" role="tab" data-auth-mode="login" aria-selected="true">Вход</button>
          <button type="button" class="tab" id="auth-mode-register" role="tab" data-auth-mode="register" aria-selected="false" tabindex="-1">Регистрация</button>
        </div>
        <h2 id="auth-title">Вход в аккаунт</h2>
        <form id="auth-form" autocomplete="on" novalidate>
          <label>
            Email
            <input id="auth-email" name="email" type="email" autocomplete="email" required maxlength="254">
          </label>
          <label>
            Пароль
            <input id="auth-password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="72">
          </label>
          <p class="auth-hint" id="auth-hint" hidden>Не короче 8 символов.</p>
          <button type="submit" id="auth-submit">Войти</button>
          <p class="form-error" id="auth-error" role="alert"></p>
        </form>
        <a class="auth-about" href="/landing/">Что умеет трекер →</a>
      </article>
    </section>

    <div class="app requires-user">
    <nav class="tabs" role="tablist" aria-label="Разделы">
      <button type="button" class="tab" id="tab-summary" role="tab" data-tab="summary" aria-selected="true" aria-controls="panel-summary">Сводка</button>
      <button type="button" class="tab" id="tab-charts" role="tab" data-tab="charts" aria-selected="false" tabindex="-1" aria-controls="panel-charts">Графики</button>
      <button type="button" class="tab" id="tab-form" role="tab" data-tab="form" aria-selected="false" tabindex="-1" aria-controls="panel-form">Новая операция</button>
      <button type="button" class="tab" id="tab-list" role="tab" data-tab="list" aria-selected="false" tabindex="-1" aria-controls="panel-list">Операции</button>
    </nav>

    <div class="tab-stage">
    <section class="cards tab-panel is-active" id="panel-summary" data-panel="summary" role="tabpanel" aria-labelledby="tab-summary">
      <article class="card card-income">
        <p class="card-label">Доход</p>
        <p class="card-value" id="income-total">0 сум</p>
      </article>
      <article class="card card-expense">
        <p class="card-label">Расход</p>
        <p class="card-value" id="expense-total">0 сум</p>
      </article>
      <article class="card card-balance">
        <p class="card-label">Баланс</p>
        <p class="card-value" id="balance-total">0 сум</p>
      </article>
    </section>

    <section class="charts tab-panel" id="panel-charts" data-panel="charts" role="tabpanel" aria-labelledby="tab-charts" aria-hidden="true">
      <article class="panel chart-panel">
        <div class="panel-head">
          <h2>По дням месяца</h2>
          <div class="legend" aria-hidden="true">
            <span class="swatch swatch-income"></span> Доход
            <span class="swatch swatch-expense"></span> Расход
          </div>
        </div>
        <div class="chart-frame" id="bar-chart"></div>
      </article>
      <article class="panel">
        <h2>Доходы по категориям</h2>
        <div id="income-donut"></div>
      </article>
      <article class="panel">
        <h2>Расходы по категориям</h2>
        <div id="expense-donut"></div>
      </article>
    </section>

    <section class="tab-panel" id="panel-form" data-panel="form" role="tabpanel" aria-labelledby="tab-form" aria-hidden="true">
      <article class="panel">
        <h2 id="form-title">Новая операция</h2>
        <form id="transaction-form" autocomplete="off">
          <div class="form-grid">
            <label>
              Тип
              <select id="type" name="type" required>
                <option value="income">Доход</option>
                <option value="expense">Расход</option>
              </select>
            </label>
            <label>
              Сумма
              <input id="amount" name="amount" type="number" min="1" step="1" required placeholder="0">
            </label>
            <label>
              Категория
              <select id="category" name="category" required></select>
            </label>
            <label>
              Дата
              <input id="date" name="date" type="date" required>
            </label>
            <label class="note-field">
              Комментарий
              <input id="note" name="note" type="text" maxlength="120" placeholder="Необязательно">
            </label>
            <div class="form-actions">
              <button type="submit" id="submit-btn">Добавить</button>
              <button type="button" id="cancel-btn" hidden>Отмена</button>
            </div>
          </div>
          <p class="form-error" id="form-error" role="alert"></p>
        </form>
      </article>

    </section>
    <section class="tab-panel" id="panel-list" data-panel="list" role="tabpanel" aria-labelledby="tab-list" aria-hidden="true">
      <article class="panel">
        <h2>Операции</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Дата</th>
                <th>Тип</th>
                <th>Категория</th>
                <th>Комментарий</th>
                <th>Сумма</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="transactions"></tbody>
          </table>
        </div>
      </article>
    </section>
    </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
